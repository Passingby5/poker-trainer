<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Poker Trainer</title>
<style>
:root{--felt:#1e7b3c;--felt2:#11542a;--rail:#6b4423;--gold:#ffd54a;--bg:#0e161e;--panel:#17222d;--panel2:#1f2e3b;--text:#f5f5f5;--muted:#b8c4ce;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.35;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overflow:hidden;touch-action:manipulation}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid transparent;min-height:46px;padding:6px 12px;font-weight:700;color:#fff;background:#34495e;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.4;cursor:default;filter:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#topbar{flex:none;display:flex;align-items:center;gap:8px;padding:5px 8px;background:#0a1016;border-bottom:2px solid #24323f;min-height:52px}
#infoBar{flex:1;min-width:0;font-size:17px;color:#e8eef2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .topbtns{display:flex;gap:6px;flex:none}
#topbar .topbtns button{min-height:42px;font-size:16px;padding:4px 10px}
#btnCoach.on,#btnCoachL.on{background:#1e8449;border-color:#7dcea0}
#tableWrap{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#felt{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,#2a9a4d 0%,var(--felt) 45%,var(--felt2) 100%);border:10px solid var(--rail);box-shadow:0 0 0 3px #3b2412,0 8px 24px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.45)}
#centerInfo{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;text-align:center}
#potLabel{font-size:var(--fs2);font-weight:800;color:#fff;background:rgba(0,0,0,.4);padding:0 14px;border-radius:20px;height:var(--potH);line-height:var(--potH);white-space:nowrap}
#board{display:flex;gap:4px;justify-content:center}
#board .card{width:var(--bcw);height:calc(var(--bcw)*1.4)}#board .card .r{font-size:calc(var(--bcw)*.5)}#board .card .s{font-size:calc(var(--bcw)*.52)}
#tableMsg{font-size:var(--fs);font-weight:700;color:var(--gold);text-shadow:0 1px 2px #000;height:var(--msgH);line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%}
.card{width:var(--cw);height:calc(var(--cw)*1.4);background:#fff;border-radius:5px;color:#111;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:0 2px 4px rgba(0,0,0,.5);line-height:1;border:1px solid #999;flex:none}
.card .r{font-size:calc(var(--cw)*.52)}.card .s{font-size:calc(var(--cw)*.54)}
.card.big{width:var(--cwm);height:calc(var(--cwm)*1.4)}.card.big .r{font-size:calc(var(--cwm)*.5)}.card.big .s{font-size:calc(var(--cwm)*.52)}
.card.red{color:#d10f1f}.four .card.dia{color:#1556c9}.four .card.clb{color:#13852f}
.card.back{background:repeating-linear-gradient(45deg,#1b4f8a 0 4px,#2867ae 4px 8px);border:2px solid #fff}
.card.empty{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.25);box-shadow:none}
.card.dim{opacity:.45}
.seat{position:absolute;width:var(--sw);height:var(--sh);background:rgba(12,18,24,.93);border:2px solid #485765;border-radius:12px;padding:3px;text-align:center;z-index:2;transition:border-color .2s,box-shadow .2s;overflow:hidden}
.seat.me{width:var(--mw);height:var(--mh);border-color:#5dade2}
.seat .srow{display:flex;align-items:center;justify-content:center;gap:3px;height:var(--f)}
.seat .face{width:var(--f);height:var(--f);border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.facesvg{width:100%;height:100%;display:block}
.seat .cards{display:flex;gap:2px;justify-content:center;align-items:center}
.seat.me .cards{height:calc(var(--cwm)*1.4)}
.seat .sname,.seat .sline{font-size:var(--fs);height:calc(var(--fs) + 3px);line-height:calc(var(--fs) + 3px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .sname{font-weight:800;margin-top:1px}
.seat .stack{color:#9fe6a0;font-weight:800}
.seat .lastact{color:#ffe082}
.seat .lastact.talk{color:#9ad1ff;font-style:italic}
.seat .lastact.win{color:#7dff9a;font-weight:800}
.seat .handnm{color:#aee}
.seat .eqb{background:#8e44ad;color:#fff;border-radius:8px;padding:0 4px;font-size:calc(var(--fs) - 1px)}
.seat.toact{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,213,74,.5),0 0 14px rgba(255,213,74,.8)}
.seat.folded .cards,.seat.folded .sname,.seat.folded .sline{opacity:.55}
.seat.folded .face{filter:saturate(.45) brightness(.85)}
.seat.winner{border-color:#2ecc71;box-shadow:0 0 0 2px rgba(46,204,113,.6),0 0 16px rgba(46,204,113,.9)}
.seat.out{opacity:.3}
.betchip{position:absolute;width:var(--chipw);height:var(--chiph);line-height:var(--chiph);background:#f5f5f5;color:#111;font-weight:800;font-size:var(--fs);border-radius:12px;z-index:1;white-space:nowrap;overflow:hidden;text-align:center;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.betchip:before{content:"";display:inline-block;width:.75em;height:.75em;border-radius:50%;background:#c0392b;border:2px dashed #fff;margin-right:3px;vertical-align:-1px}
.dealer{position:absolute;width:var(--db);height:var(--db);border-radius:50%;background:#fff;color:#111;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:calc(var(--db)*.55);box-shadow:0 2px 4px rgba(0,0,0,.6);z-index:1;border:2px solid #333}
.bubble{position:absolute;background:#fffbe6;color:#111;font-weight:700;font-size:var(--fs);line-height:1.2;padding:4px 8px;border-radius:10px;z-index:5;max-width:var(--bubW);text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.5);pointer-events:none;animation:pop .18s ease-out;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.bubble.talk{background:#e3f2fd;font-style:italic;font-weight:600;border:2px solid #90caf9}
.bubble.measure{visibility:hidden;animation:none}
@keyframes pop{from{opacity:0}to{opacity:1}}
#strip{flex:none;height:54px;margin:3px 6px 0;padding:3px 10px;background:#13324a;border:2px solid #2e86c1;border-radius:12px;cursor:pointer;overflow:hidden}
#stripMain{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:22px;line-height:22px}
#stripLast{font-size:15px;color:#cfe3f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:21px;line-height:21px}
#stripMain .rec{display:inline-block;padding:0 7px;border-radius:6px;font-weight:900;background:#f1c40f;color:#111}
#stripLast .talk{color:#9ad1ff;font-style:italic}
#controls{flex:none;height:var(--ctlH);background:var(--panel);border:2px solid #2c3e50;border-radius:14px;padding:6px 8px;margin:4px 6px 4px;overflow:hidden}
#statusLine{display:none}
#lsBar,#lsTalk{display:none}
.row{display:flex;gap:6px;justify-content:center;margin-top:6px}
.row:first-of-type{margin-top:0}
#actRow{margin-top:0}
.act{flex:1 1 0;min-width:0;min-height:56px;font-size:20px;padding:4px 6px;line-height:1.1}
.act.fold{background:#b03a2e}.act.call{background:#1f618d}.act.raise{background:#ca6f1e}.act.next{background:#1e8449;font-size:22px;min-height:72px}.act.skip{background:#5d6d7e;font-size:18px;min-height:72px}
#betweenRow{margin-top:0;height:100%;align-items:center}
#sizeRow{align-items:center}
#sizeRow input[type=range]{flex:1;min-width:80px;height:40px;accent-color:#f39c12}
#sizeRow .small{min-width:48px;font-size:24px;padding:0 8px;min-height:42px}
#sizeVal{font-size:20px;font-weight:800;min-width:72px;text-align:center;color:#ffd27f}
#quickRow button{flex:1 1 0;min-width:0;background:#4a5d6e;font-size:16px;min-height:42px;padding:2px 4px}
#quickRow #bHint{background:#7d6608}
body.limit #sizeRow,body.limit #quickRow [data-q]{display:none!important}
body.limit{--ctlH:132px}
#sideBack{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39}
#side{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:2px solid #2c3e50;z-index:40;display:flex;flex-direction:column;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) calc(var(--sab) + 6px) 8px;box-shadow:-8px 0 24px rgba(0,0,0,.5)}
.sidehead{display:flex;gap:6px;align-items:center;margin-bottom:6px}.sidehead b{flex:1;font-size:19px;color:var(--gold)}
.sidehead button{min-height:42px;font-size:15px;padding:4px 9px}
#btnCloseSide{background:#7b241c;font-size:20px;min-width:46px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;min-height:42px;font-size:15px;padding:4px 4px;background:#2c3e50}
.tabs button.on{background:#2e86c1}
.tabpane{overflow:auto;padding:8px 4px;font-size:16px;flex:1;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#coachBox{background:#13324a;border:2px solid #2e86c1;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:17px}
#coachBox .big{font-size:18px;font-weight:800}
#coachBox .rec{display:inline-block;padding:1px 10px;border-radius:8px;font-weight:900;background:#f1c40f;color:#111}
#tab-log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
#tab-log .hh{color:var(--gold);font-weight:800;margin-top:8px}
#tab-log .tk{color:#9ad1ff;font-style:italic}
#tab-log .win{color:#7dff9a;font-weight:700}
#tab-log .st{color:#ffcf8a;font-weight:700}
.opp{background:var(--panel2);border-radius:12px;padding:8px 10px;margin-bottom:8px;border-left:6px solid #777;overflow:hidden}
.opp .oface{float:left;width:58px;height:58px;border-radius:50%;overflow:hidden;margin:2px 10px 4px 0}
.opp h4{margin:0 0 2px;font-size:18px}.opp .insp{font-size:13px;color:var(--muted)}
.opp .sum{font-size:15px;margin:4px 0;clear:left}.opp .st{font-size:15px;color:#cfe}
.opp .tip{font-size:14px;color:#ffe082}
.opp .read{font-size:14px;color:#9ad1ff;margin-top:4px;border-top:1px solid rgba(255,255,255,.1);padding-top:4px}
.statgrid{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:17px}
.statgrid b{color:#9fe6a0}
.rev{background:var(--panel2);border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:16px}
.rev .h{font-weight:800;color:var(--gold)}
.good{color:#7dff9a}.warn{color:#ffb74d}.bad{color:#ff8a80}
.minicard{display:inline-block;background:#fff;color:#111;border-radius:4px;padding:0 4px;margin:0 1px;font-weight:800}
.minicard.red{color:#d10f1f}.four .minicard.dia{color:#1556c9}.four .minicard.clb{color:#13852f}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);overscroll-behavior:contain}
#modal{background:#18242f;border:2px solid #3d566e;border-radius:18px;max-width:820px;width:100%;padding:16px 18px;margin:auto;font-size:18px}
#modal h1{margin:4px 0 6px;color:var(--gold);font-size:28px}#modal h2{font-size:21px;margin:14px 0 6px;color:#9ad1ff}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{background:#2c3e50;min-width:70px;font-size:19px}
.choice button.sel{background:#2e86c1;border-color:#aed6f1}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.lineup label{display:flex;gap:8px;align-items:center;background:#22313f;padding:8px;border-radius:10px;font-size:16px;cursor:pointer}
.lineup .lface{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none}
.lineup input,.chk input{width:26px;height:26px;flex:none}
.chk{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:18px;cursor:pointer}
.disclaimer{background:#3b2f12;border:1px solid #a67c00;border-radius:10px;padding:8px 12px;font-size:16px;margin-top:12px}
.bigbtn{font-size:24px;min-height:64px;padding:10px 28px;background:#1e8449}
.rank-list{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:17px}
.facegrid{display:flex;flex-wrap:wrap;gap:6px}.facegrid div{width:52px;text-align:center;font-size:12px}.facegrid .fc{width:52px;height:52px;border-radius:50%;overflow:hidden}
@media (max-width:600px){
  #infoBar{font-size:15px}
  #topbar .topbtns button{font-size:15px;padding:4px 8px;min-height:40px}
  #topbar{min-height:46px;padding:3px 6px}
  .act{font-size:18px}
}
/* ---------- phone held sideways: table + essential buttons only ---------- */
@media (orientation:landscape) and (max-height:520px){
  :root{--ctlH:auto}
  #app{display:grid;grid-template-columns:minmax(0,1fr) calc(170px + var(--sar));grid-template-rows:minmax(0,1fr);padding-right:0}
  #topbar,#strip{display:none!important}
  #tableWrap{grid-column:1;grid-row:1}
  #controls{grid-column:2;grid-row:1;height:auto;margin:0;border-radius:0;border-width:0 0 0 2px;padding:4px calc(6px + var(--sar)) 4px 6px;display:flex;flex-direction:column;gap:4px}
  #lsBar{display:flex;align-items:center;gap:4px}
  #lsInfo{flex:1;min-width:0;font-size:12px;line-height:1.2;color:#cfe3f3;overflow:hidden;max-height:30px}
  .lsbtns{display:flex;gap:3px}.lsbtns button{min-height:34px;min-width:34px;padding:0 4px;font-size:16px;border-radius:9px}
  #statusLine{display:block;font-size:13px;font-weight:700;text-align:center;line-height:1.2;height:32px;overflow:hidden;color:#ffe9a8}
  #lsTalk{display:block;font-size:12px;font-style:italic;color:#9ad1ff;line-height:1.2;height:30px;overflow:hidden}
  .row{margin-top:0;gap:4px}
  #actRow{flex-direction:column;gap:4px;flex:1 1 auto}
  .act{min-height:42px;font-size:16px;flex:1 1 0}
  #sizeRow{flex-wrap:nowrap}#sizeRow input[type=range]{display:none}
  #sizeRow .small{min-width:40px;min-height:36px;font-size:20px}#sizeVal{min-width:0;flex:1;font-size:16px}
  #quickRow{display:grid!important;grid-template-columns:1fr 1fr;gap:3px}#quickRow[hidden]{display:none!important}
  #quickRow button{min-height:32px;font-size:13px;padding:0 2px;border-radius:8px}
  #betweenRow{flex-direction:column;height:auto;flex:1 1 auto}
  .act.next,.act.skip{min-height:52px;font-size:17px}
  body.limit #actRow{flex:0 0 auto}
  body.limit .act{min-height:56px}
}

.faceimg{width:100%;height:100%;display:block;object-fit:cover;background:#1e3a2a}
</style></head>
<body>
<div id="app">
<header id="topbar">
  <div id="infoBar">Welcome!</div>
  <div class="topbtns">
    <button id="btnCoach" title="Show advice before each of your decisions">Coach: OFF</button>
    <button id="btnInfo" title="Review, hand log, opponents and your stats">Info</button>
    <button id="btnHelp">Help</button>
    <button id="btnMenu">Menu</button>
  </div>
</header>
<section id="tableWrap">
  <div id="felt"></div>
  <div id="centerInfo"><div id="potLabel">Pot: $0</div><div id="board"></div><div id="tableMsg"></div></div>
  <div id="seats"></div>
</section>
<div id="strip" role="status" title="Tap for the full review and coach advice"><div id="stripMain">This hand</div><div id="stripLast"></div></div>
<div id="controls">
  <div id="lsBar"><div id="lsInfo"></div><div class="lsbtns"><button id="btnCoachL" aria-label="Coach on or off">&#127891;</button><button id="btnInfoL" aria-label="Info">&#128202;</button><button id="btnMenuL" aria-label="Menu">&#9776;</button></div></div>
  <div id="statusLine">Press Start to begin.</div>
  <div id="lsTalk"></div>
  <div class="row" id="actRow">
    <button id="bFold" class="act fold">Fold</button>
    <button id="bCall" class="act call">Check</button>
    <button id="bRaise" class="act raise">Raise</button>
  </div>
  <div class="row" id="sizeRow">
    <button id="bMinus" class="small" aria-label="Smaller bet">&minus;</button>
    <input type="range" id="slider" min="0" max="100" step="1" aria-label="Bet size">
    <button id="bPlus" class="small" aria-label="Bigger bet">+</button>
    <span id="sizeVal">$0</span>
  </div>
  <div class="row" id="quickRow">
    <button data-q="0.5">&frac12; Pot</button><button data-q="0.667">&#8532; Pot</button><button data-q="1">Pot</button><button data-q="allin">All-in</button><button id="bHint">&#128161; Hint</button>
  </div>
  <div class="row" id="betweenRow">
    <button id="bNext" class="act next">Deal next hand &#9654;</button>
    <button id="bSkip" class="act skip">Skip to end &#9193;</button>
  </div>
</div>
</div>
<div id="sideBack" hidden></div>
<aside id="side" hidden aria-label="Game info">
  <div class="sidehead"><b>Game info</b><button id="btnSpeed">Speed: Normal</button><button id="btnTalk">Talk: Some</button><button id="btnCloseSide" aria-label="Close">&#10005;</button></div>
  <div class="tabs">
    <button data-tab="review" class="on">Review</button><button data-tab="log">Hand log</button><button data-tab="opps">Opponents</button><button data-tab="stats">My stats</button>
  </div>
  <div id="tab-review" class="tabpane"><div id="coachBox" hidden></div><div id="reviewList"><p>After each hand you will see a short review of your decisions here.</p></div></div>
  <div id="tab-log" class="tabpane" hidden></div>
  <div id="tab-opps" class="tabpane" hidden></div>
  <div id="tab-stats" class="tabpane" hidden></div>
</aside>
<div id="overlay" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>

<script id="engine">
/* ===== Poker engine: pure game logic, no DOM. Runs in browser or Node (headless tests). ===== */
var PokerEngine = (function () {
'use strict';
var RANKS = '23456789TJQKA', SUITS = 'shdc';
var SUIT_SYM = ['\u2660', '\u2665', '\u2666', '\u2663'];

var deckRngOverride = null;
function setRng(f) { rnd = f || Math.random; deckRngOverride = f || null; }
var _u32 = new Uint32Array(64), _u32i = 64;
function cryptoU32() { if (_u32i >= 64) { cryptoObj.getRandomValues(_u32); _u32i = 0; } return _u32[_u32i++]; }
function randInt(n) {
  if (deckRngOverride || !cryptoObj) return Math.floor((deckRngOverride || Math.random)() * n);
  var lim = 4294967296 - (4294967296 % n), x;
  do { x = cryptoU32(); } while (x >= lim);
  return x % n;
}
